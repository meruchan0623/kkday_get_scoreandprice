[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kkday-sku-price-scraper"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "playwright>=1.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires an authorized local KKday browser session",
]
